apply plugin: 'com.android.application'

// Release signing. Credentials never live in the repository:
//  - locally  : android/keystore.properties (git-ignored)
//  - Codemagic: CM_KEYSTORE_PATH / CM_KEY_ALIAS / CM_KEYSTORE_PASSWORD / CM_KEY_PASSWORD
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def ksPath = keystoreProperties['storeFile'] ?: System.getenv('CM_KEYSTORE_PATH')
def ksPassword = keystoreProperties['storePassword'] ?: System.getenv('CM_KEYSTORE_PASSWORD')
def ksAlias = keystoreProperties['keyAlias'] ?: System.getenv('CM_KEY_ALIAS')
def ksAliasPassword = keystoreProperties['keyPassword'] ?: System.getenv('CM_KEY_PASSWORD')
def hasReleaseSigning = ksPath != null && file(ksPath).exists() &&
        ksPassword != null && !ksPassword.toString().isEmpty() &&
        ksAlias != null && !ksAlias.toString().isEmpty() &&
        ksAliasPassword != null && !ksAliasPassword.toString().isEmpty()
def configuredVersionCode = System.getenv('ANDROID_VERSION_CODE')
// Version 1 is for local debug only; release tasks must use the CI-resolved value.
def releaseVersionCode = configuredVersionCode ?: '1'
if (!(releaseVersionCode ==~ /[1-9][0-9]*/) ||
        new BigInteger(releaseVersionCode) > new BigInteger('2100000000')) {
    throw new GradleException('ANDROID_VERSION_CODE must be an integer from 1 to 2100000000.')
}
// Never silently produce an unsigned release artifact. Debug builds stay usable.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (configuredVersionCode == null || configuredVersionCode.isEmpty()) {
            throw new GradleException('Release version is missing. Pass the preflight-resolved ANDROID_VERSION_CODE; debug version 1 cannot be used for release.')
        }
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is incomplete. Configure the existing upload keystore securely.')
        }
    }
}

android {
    namespace = "com.ashglogroup.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ashglogroup.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(releaseVersionCode)
        versionName System.getenv('ANDROID_VERSION_NAME') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksAliasPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
