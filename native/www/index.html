<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ASH Glo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080812;
        color: #f5f5fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        font-size: 14px;
        opacity: 0.7;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>ASH Glo</h1>
        <p>Connecting…<br />Check your internet connection if this screen stays.</p>
      </div>
    </main>
  </body>
</html>
