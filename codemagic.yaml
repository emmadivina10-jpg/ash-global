workflows:
  ios-app-store:
    name: ASH Glo iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: ash glo

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ashglogroup.mobile

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ashglogroup.mobile"

      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      # ============================================================
      # INSTALL JAVASCRIPT DEPENDENCIES
      # ============================================================
      - name: Install JS dependencies
        script: |
          set -e

          echo "========================================"
          echo " INSTALLING JAVASCRIPT DEPENDENCIES"
          echo "========================================"

          npm install -g npm@11
          npm --version

          rm -rf node_modules

          npm ci --no-audit --no-fund || {
            echo "npm ci failed — falling back to npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund
          }

      # ============================================================
      # CAPACITOR IOS SYNC
      # ============================================================
      - name: Capacitor sync
        script: |
          set -e

          echo "========================================"
          echo " SYNCING CAPACITOR IOS PROJECT"
          echo "========================================"

          npx cap sync ios

      # ============================================================
      # SET IOS BUILD NUMBER
      # ============================================================
      - name: Set build number
        script: |
          set -e

          echo "========================================"
          echo " SETTING IOS BUILD NUMBER"
          echo "========================================"

          cd ios/App

          echo "Codemagic workflow build number: $BUILD_NUMBER"

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: BUILD_NUMBER is not numeric: $BUILD_NUMBER"
            exit 1
          fi

          # Use Codemagic's workflow build number.
          # This guarantees that every new Codemagic build
          # receives a higher iOS CFBundleVersion.
          agvtool new-version -all "$BUILD_NUMBER"

          echo "Final iOS build number:"
          agvtool what-version -terse

      # ============================================================
      # INITIALIZE KEYCHAIN + APPLY CODE SIGNING
      # ============================================================
      - name: Initialise keychain and apply signing
        script: |
          set -e

          echo "========================================"
          echo " INITIALISING KEYCHAIN"
          echo "========================================"

          keychain initialize

          echo
          echo "========================================"
          echo " INSTALLING SIGNING CERTIFICATES"
          echo "========================================"

          keychain add-certificates

          echo
          echo "========================================"
          echo " APPLYING PROVISIONING PROFILES"
          echo "========================================"

          xcode-project use-profiles

      # ============================================================
      # VERIFY IOS SIGNING
      # ============================================================
      - name: Verify iOS signing configuration
        script: |
          set -e

          mkdir -p /tmp/xcodebuild_logs

          echo
          echo "========================================"
          echo " CODE SIGNING IDENTITIES"
          echo "========================================"

          security find-identity -v -p codesigning || true

          echo
          echo "========================================"
          echo " XCODE BUILD SETTINGS"
          echo "========================================"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            | grep -E \
              "^[[:space:]]*(CODE_SIGN|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|SUPPORTED_PLATFORMS|CURRENT_PROJECT_VERSION)" \
            || true

          echo
          echo "========================================"
          echo " APP ENTITLEMENTS"
          echo "========================================"

          if [ -f "ios/App/App/App.entitlements" ]; then
            /usr/libexec/PlistBuddy \
              -c Print \
              ios/App/App/App.entitlements \
              || true
          else
            echo "No App.entitlements file found"
          fi

          echo
          echo "========================================"
          echo " INSTALLED PROVISIONING PROFILES"
          echo "========================================"

          for profile in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do

            [ -e "$profile" ] || continue

            decoded="/tmp/xcodebuild_logs/$(basename "$profile").plist"

            security cms -D -i "$profile" > "$decoded"

            echo
            echo "----------------------------------------"
            echo "Profile:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' \
              "$decoded" \
              2>/dev/null || echo "unknown"

            echo "UUID:"
            /usr/libexec/PlistBuddy \
              -c 'Print :UUID' \
              "$decoded" \
              2>/dev/null || echo "unknown"

            echo "Application identifier:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "Push environment:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:aps-environment' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "Associated domains:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.associated-domains' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "----------------------------------------"

          done

      # ============================================================
      # BUILD IOS ARCHIVE
      # ============================================================
      - name: Build iOS Archive
        script: |
          set -o pipefail

          mkdir -p \
            /tmp/xcodebuild_logs \
            "$CM_BUILD_DIR/build/ios/xcarchive" \
            "$CM_BUILD_DIR/build/ios/ipa"

          rm -rf \
            /tmp/xcodebuild_logs/archive.xcresult \
            /tmp/xcodebuild_logs/export.xcresult \
            "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"

          echo
          echo "========================================"
          echo " BUILDING IOS ARCHIVE"
          echo "========================================"

          echo "Using iOS build number: $BUILD_NUMBER"

          set +e

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -resultBundlePath /tmp/xcodebuild_logs/archive.xcresult \
            clean archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            2>&1 \
            | tee /tmp/xcodebuild_logs/xcodebuild-archive.log

          archive_status=${PIPESTATUS[0]}

          set -e

          if [ "$archive_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " ARCHIVE FAILED"
            echo "========================================"

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate)" \
              /tmp/xcodebuild_logs/xcodebuild-archive.log \
              | head -n 150 \
              || true

            exit "$archive_status"

          fi

          echo
          echo "========================================"
          echo " ARCHIVE SUCCEEDED"
          echo "========================================"

      # ============================================================
      # EXPORT IPA
      # ============================================================
      - name: Build IPA
        script: |
          set -o pipefail

          echo
          echo "========================================"
          echo " PREPARING IPA EXPORT"
          echo "========================================"

          cat > /tmp/xcodebuild_logs/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

            <key>destination</key>
            <string>export</string>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

            <key>method</key>
            <string>app-store-connect</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>com.ashglogroup.mobile</key>
              <string>ASH Glo App Store 2026 Production</string>
            </dict>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>uploadSymbols</key>
            <true/>

          </dict>
          </plist>
          PLIST

          echo
          echo "========================================"
          echo " EXPORT OPTIONS"
          echo "========================================"

          cat /tmp/xcodebuild_logs/ExportOptions.plist

          echo
          echo "========================================"
          echo " EXPORTING IPA"
          echo "========================================"

          set +e

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/xcodebuild_logs/ExportOptions.plist \
            -resultBundlePath /tmp/xcodebuild_logs/export.xcresult \
            2>&1 \
            | tee /tmp/xcodebuild_logs/xcodebuild-export.log

          export_status=${PIPESTATUS[0]}

          set -e

          if [ "$export_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " EXPORT FAILED"
            echo "========================================"

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate)" \
              /tmp/xcodebuild_logs/xcodebuild-export.log \
              | head -n 150 \
              || true

            exit "$export_status"

          fi

          echo
          echo "========================================"
          echo " IPA EXPORT SUCCEEDED"
          echo "========================================"

      # ============================================================
      # VERIFY IPA
      # ============================================================
      - name: Verify generated IPA
        script: |
          set -e

          echo "========================================"
          echo " VERIFYING GENERATED IPA"
          echo "========================================"

          ls -lah "$CM_BUILD_DIR/build/ios/ipa"

          IPA_FILE=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo
          echo "IPA:"
          echo "$IPA_FILE"

          echo
          echo "IPA size:"
          du -h "$IPA_FILE"

          echo
          echo "========================================"
          echo " IPA READY"
          echo "========================================"

      # ============================================================
      # VERIFY FINAL IOS BUILD NUMBER
      # ============================================================
      - name: Verify final iOS build number
        script: |
          set -e

          echo "========================================"
          echo " VERIFYING FINAL IOS BUILD NUMBER"
          echo "========================================"

          IPA_FILE=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          TEMP_DIR=$(mktemp -d)

          unzip -q "$IPA_FILE" -d "$TEMP_DIR"

          APP_PATH=$(find "$TEMP_DIR/Payload" -maxdepth 1 -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App bundle not found inside IPA."
            rm -rf "$TEMP_DIR"
            exit 1
          fi

          FINAL_BUILD_NUMBER=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PATH/Info.plist"
          )

          FINAL_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )

          echo "Expected build number: $BUILD_NUMBER"
          echo "Actual build number:   $FINAL_BUILD_NUMBER"
          echo "Bundle identifier:     $FINAL_BUNDLE_ID"

          if [ "$FINAL_BUILD_NUMBER" != "$BUILD_NUMBER" ]; then
            echo "ERROR: Final IPA build number does not match Codemagic BUILD_NUMBER."
            rm -rf "$TEMP_DIR"
            exit 1
          fi

          if [ "$FINAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Final IPA bundle identifier does not match BUNDLE_ID."
            rm -rf "$TEMP_DIR"
            exit 1
          fi

          echo
          echo "========================================"
          echo " FINAL IPA VERIFICATION PASSED"
          echo "========================================"

          rm -rf "$TEMP_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**

    publishing:
      app_store_connect:
        # Uses the existing "ash glo" App Store Connect integration
        # declared under integrations above — no new API key variables.
        auth: integration
        # Upload the signed IPA and make it available through TestFlight
        # processing. Does not submit an App Store production release.
        submit_to_testflight: true

  # ================================================================
  # ANDROID — GOOGLE PLAY
  # ================================================================
  android-play:
    name: ASH Glo Android — Google Play
    # linux_x2 requires billing-enabled pay-as-you-go; mac_mini_m2 is the
    # instance this plan already runs (same as the iOS workflow) and includes
    # the Android SDK, so the AAB build works without a billing change.
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      android_signing:
        - ash_glo_keystore

      groups:
        # Only android_release exists in Codemagic; google_play is publishing-only.
        - android_release

      vars:
        ASH_NATIVE_PLATFORM: android
        CAP_SERVER_URL: https://ashglogroup.company
        # In android_release, set ANDROID_PREVIOUS_VERSION_CODE from Play's highest
        # uploaded code (0 only for a confirmed first upload). No guessed default.
        # With ANDROID_VERSION_CODE unset, preflight adds BUILD_NUMBER to that
        # previous code, or to an explicitly supplied ANDROID_VERSION_CODE_BASE.
      node: 22
      java: 21

    scripts:
      # ============================================================
      # INSTALL JAVASCRIPT DEPENDENCIES
      # ============================================================
      - name: Install JS dependencies
        script: |
          set -e

          echo "========================================"
          echo " INSTALLING JAVASCRIPT DEPENDENCIES"
          echo "========================================"

          # Existing Android/app manager; iOS retains its separate npm workflow.
          npm install --global bun@1.4.4
          bun install --frozen-lockfile
          # Run the project's own postinstall explicitly (no blanket trust).
          node scripts/postinstall-entities-shim.mjs

      - name: Check release inputs and Android SDK
        script: |
          set -euo pipefail
          # Resolve once; CM_ENV shares this exact value with the Gradle/artifact step.
          ANDROID_VERSION_CODE=$(node scripts/android-release-preflight.mjs --version-code)
          export ANDROID_VERSION_CODE
          printf 'ANDROID_VERSION_CODE=%s\n' "$ANDROID_VERSION_CODE" >> "$CM_ENV"
          printf 'Resolved Android release versionCode=%s\n' "$ANDROID_VERSION_CODE"
          test -n "${CM_KEYSTORE_PATH:-}" && test -f "$CM_KEYSTORE_PATH"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Verify web application compiles (no deployment)
        script: |
          set -e
          npm run build

      # ============================================================
      # CAPACITOR ANDROID SYNC
      # ============================================================
      - name: Capacitor sync
        script: |
          set -e

          echo "========================================"
          echo " SYNCING CAPACITOR ANDROID PROJECT"
          echo "========================================"

          npx cap sync android
          node --input-type=module -e 'import fs from "node:fs"; const c = JSON.parse(fs.readFileSync("android/app/src/main/assets/capacitor.config.json", "utf8")); if (c.appId !== "com.ashglogroup.app" || c.server.url !== "https://ashglogroup.company") throw Error("Unexpected Android identity or server URL");'

      # ============================================================
      # BUILD SIGNED ANDROID AAB
      # ============================================================
      - name: Build signed AAB
        script: |
          set -euo pipefail

          echo "========================================"
          echo " BUILDING ANDROID RELEASE"
          echo "========================================"

          cd android

          chmod +x ./gradlew

          ./gradlew --no-daemon bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" > /tmp/ash-aab-signature.txt
          grep -q 'jar verified' /tmp/ash-aab-signature.txt
          if grep -q 'jar is unsigned' /tmp/ash-aab-signature.txt; then
            echo "ERROR: unsigned Android bundle"
            exit 1
          fi
          java ../scripts/VerifyAndroidBundle.java "$AAB"
          # Pin and verify the tool before reading the actual generated manifest.
          curl --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output /tmp/ash-bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  /tmp/ash-bundletool.jar' | shasum -a 256 --check
          java -jar /tmp/ash-bundletool.jar validate --bundle="$AAB"
          PACKAGE=$(java -jar /tmp/ash-bundletool.jar dump manifest --bundle="$AAB" --xpath='/manifest/@package')
          VERSION=$(java -jar /tmp/ash-bundletool.jar dump manifest --bundle="$AAB" --xpath='/manifest/@android:versionCode')
          test "$PACKAGE" = 'com.ashglogroup.app'
          test "$VERSION" = "$ANDROID_VERSION_CODE"
          printf 'Verified AAB package=%s versionCode=%s\n' "$PACKAGE" "$VERSION"

          echo
          echo "========================================"
          echo " ANDROID BUILD SUCCEEDED"
          echo "========================================"

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    # Artifact-only. No Google Play publishing or automatic build trigger.
