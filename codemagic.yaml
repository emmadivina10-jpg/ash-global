workflows:
  ios-app-store:
    name: ASH Glo iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: ASH Glo App Store

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ashglogroup.mobile

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ashglogroup.mobile"

      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      # ============================================================
      # INSTALL JAVASCRIPT DEPENDENCIES
      # ============================================================
      - name: Install JS dependencies
        script: |
          set -e

          echo "========================================"
          echo " INSTALLING JS DEPENDENCIES"
          echo "========================================"

          npm install -g npm@11

          echo "npm version:"
          npm --version

          rm -rf node_modules

          npm ci --no-audit --no-fund || {
            echo "npm ci failed — falling back to fresh install"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          }

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        script: |
          set -e

          echo "========================================"
          echo " CAPACITOR SYNC"
          echo "========================================"

          npx cap sync

      # ============================================================
      # SET BUILD NUMBER
      # ============================================================
      - name: Set build number from App Store Connect
        script: |
          set -e

          echo "========================================"
          echo " SETTING IOS BUILD NUMBER"
          echo "========================================"

          cd ios/App

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || echo 0
          )

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest App Store build number: $LATEST_BUILD_NUMBER"
          echo "New build number: $NEW_BUILD_NUMBER"

          agvtool new-version -all "$NEW_BUILD_NUMBER"

          echo "Build number successfully set to $NEW_BUILD_NUMBER"

      # ============================================================
      # INITIALISE KEYCHAIN + APPLY APPLE SIGNING
      # ============================================================
      - name: Initialise keychain and apply signing
        script: |
          set -e

          echo "========================================"
          echo " INITIALISING KEYCHAIN"
          echo "========================================"

          keychain initialize

          echo "========================================"
          echo " INSTALLING SIGNING CERTIFICATES"
          echo "========================================"

          keychain add-certificates

          echo "========================================"
          echo " APPLYING PROVISIONING PROFILES"
          echo "========================================"

          xcode-project use-profiles

          echo "========================================"
          echo " SIGNING MATERIAL APPLIED"
          echo "========================================"

      # ============================================================
      # VERIFY SIGNING CONFIGURATION
      # ============================================================
      - name: Verify iOS signing configuration
        script: |
          set -e

          mkdir -p /tmp/xcodebuild_logs

          echo
          echo "========================================"
          echo " INSTALLED CODE SIGNING IDENTITIES"
          echo "========================================"

          security find-identity -v -p codesigning || true

          echo
          echo "========================================"
          echo " EFFECTIVE RELEASE SIGNING SETTINGS"
          echo "========================================"

          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            > /tmp/xcodebuild_logs/build-settings.log 2>&1 || true

          grep -E \
            "^[[:space:]]*(CODE_SIGN|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|SUPPORTED_PLATFORMS)" \
            /tmp/xcodebuild_logs/build-settings.log \
            || true

          echo
          echo "========================================"
          echo " REQUESTED APP ENTITLEMENTS"
          echo "========================================"

          if [ -f "ios/App/App/App.entitlements" ]; then
            /usr/libexec/PlistBuddy \
              -c Print \
              ios/App/App/App.entitlements \
              || true
          else
            echo "App.entitlements file not found"
          fi

          echo
          echo "========================================"
          echo " INSTALLED PROVISIONING PROFILES"
          echo "========================================"

          PROFILE_FOUND=0

          for profile in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do

            [ -e "$profile" ] || continue

            PROFILE_FOUND=1

            decoded="/tmp/xcodebuild_logs/$(basename "$profile").plist"

            security cms -D -i "$profile" > "$decoded"

            echo
            echo "----------------------------------------"

            echo "Profile:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' \
              "$decoded" \
              2>/dev/null || echo "unknown"

            echo "UUID:"
            /usr/libexec/PlistBuddy \
              -c 'Print :UUID' \
              "$decoded" \
              2>/dev/null || echo "unknown"

            echo "Application identifier:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "Push environment:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:aps-environment' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "Associated domains:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.associated-domains' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "Team identifier:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.team-identifier' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "----------------------------------------"

          done

          if [ "$PROFILE_FOUND" -eq 0 ]; then
            echo "WARNING: No provisioning profiles were found."
          fi

          echo
          echo "========================================"
          echo " SIGNING DIAGNOSTICS COMPLETE"
          echo "========================================"

      # ============================================================
      # BUILD ARCHIVE + EXPORT IPA
      # ============================================================
      - name: Build IPA
        script: |
          set -o pipefail

          mkdir -p \
            /tmp/xcodebuild_logs \
            build/ios/xcarchive \
            build/ios/ipa

          rm -rf \
            /tmp/xcodebuild_logs/archive.xcresult \
            /tmp/xcodebuild_logs/export.xcresult \
            build/ios/xcarchive/App.xcarchive

          echo
          echo "========================================"
          echo " BUILDING IOS ARCHIVE"
          echo "========================================"

          set +e

          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -resultBundlePath /tmp/xcodebuild_logs/archive.xcresult \
            clean archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild-archive.log

          archive_status=${PIPESTATUS[0]}

          set -e

          if [ "$archive_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " ARCHIVE FAILED"
            echo "========================================"

            echo
            echo "=== FIRST COMPILER / SIGNING ERRORS ==="

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate|signing)" \
              /tmp/xcodebuild_logs/xcodebuild-archive.log \
              | head -n 150 \
              || true

            echo
            echo "=== END ARCHIVE DIAGNOSTICS ==="

            exit "$archive_status"

          fi

          echo
          echo "========================================"
          echo " ARCHIVE SUCCEEDED"
          echo "========================================"

          echo
          echo "Archive created at:"
          echo "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"

          # ========================================================
          # EXPORT OPTIONS
          # ========================================================

          echo
          echo "========================================"
          echo " CREATING EXPORT OPTIONS"
          echo "========================================"

          cat > /tmp/xcodebuild_logs/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

            <key>method</key>
            <string>app-store-connect</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>com.ashglogroup.mobile</key>
              <string>ASH Glo Mobile</string>
            </dict>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          echo "ExportOptions.plist created."

          echo
          echo "========================================"
          echo " EXPORTING IPA"
          echo "========================================"

          set +e

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/xcodebuild_logs/ExportOptions.plist \
            -resultBundlePath /tmp/xcodebuild_logs/export.xcresult \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild-export.log

          export_status=${PIPESTATUS[0]}

          set -e

          if [ "$export_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " EXPORT FAILED"
            echo "========================================"

            echo
            echo "=== FIRST EXPORT / SIGNING ERRORS ==="

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate|signing)" \
              /tmp/xcodebuild_logs/xcodebuild-export.log \
              | head -n 150 \
              || true

            echo
            echo "=== ARCHIVE CONTENTS ==="

            /usr/bin/find \
              "$CM_BUILD_DIR/build/ios/xcarchive" \
              -maxdepth 5 \
              -type f \
              | head -n 100 \
              || true

            echo
            echo "=== END EXPORT DIAGNOSTICS ==="

            exit "$export_status"

          fi

          echo
          echo "========================================"
          echo " IPA EXPORT SUCCEEDED"
          echo "========================================"

          echo
          echo "Generated IPA files:"
          ls -lh "$CM_BUILD_DIR/build/ios/ipa/" || true

      # ============================================================
      # FINAL IPA CHECK
      # ============================================================
      - name: Verify generated IPA
        script: |
          set -e

          echo
          echo "========================================"
          echo " VERIFYING GENERATED IPA"
          echo "========================================"

          if ls build/ios/ipa/*.ipa >/dev/null 2>&1; then

            echo "IPA successfully generated:"
            ls -lh build/ios/ipa/*.ipa

          else

            echo "ERROR: No IPA file was generated."
            exit 1

          fi

    # ==============================================================
    # IOS ARTIFACTS
    # ==============================================================
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**

    # ==============================================================
    # TESTFLIGHT / APP STORE CONNECT
    # ==============================================================
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # =================================================================
  # ANDROID — GOOGLE PLAY
  # =================================================================
  android-play:
    name: ASH Glo Android — Play Store
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      android_signing:
        - ash_glo_keystore

      groups:
        - google_play

      node: 20
      java: 21

    scripts:
      # ============================================================
      # INSTALL JS DEPENDENCIES
      # ============================================================
      - name: Install JS dependencies
        script: |
          set -e

          npm install -g npm@11

          echo "npm version:"
          npm --version

          rm -rf node_modules

          npm ci --no-audit --no-fund || {
            echo "npm ci failed — falling back to fresh install"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          }

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        script: |
          set -e

          npx cap sync

      # ============================================================
      # BUILD ANDROID AAB
      # ============================================================
      - name: Build signed AAB
        script: |
          set -e

          cd android

          ./gradlew bundleRelease

    # ==============================================================
    # ANDROID ARTIFACTS
    # ==============================================================
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    # ==============================================================
    # GOOGLE PLAY PUBLISHING
    # ==============================================================
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
