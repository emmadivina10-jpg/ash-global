workflows:
  ios-app-store:
    name: ASH Glo iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: ASH Glo App Store

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ashglogroup.mobile

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ashglogroup.mobile"

      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm install -g npm@11
          npm --version

          rm -rf node_modules

          npm ci --no-audit --no-fund || {
            echo "npm ci failed — falling back to fresh install"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          }

      - name: Capacitor sync
        script: |
          npx cap sync

      - name: Set build number from App Store Connect
        script: |
          cd ios/App

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || echo 0
          )

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest build number: $LATEST_BUILD_NUMBER"
          echo "New build number: $NEW_BUILD_NUMBER"

          agvtool new-version -all "$NEW_BUILD_NUMBER"

      - name: Initialise keychain and apply signing
        script: |
          set -e

          echo "=== Initialising keychain ==="
          keychain initialize

          echo "=== Installing signing certificates ==="
          keychain add-certificates

          echo "=== Applying provisioning profiles ==="
          xcode-project use-profiles

      - name: Verify iOS signing configuration
        script: |
          set -e

          mkdir -p /tmp/xcodebuild_logs

          echo "========================================"
          echo " INSTALLED CODE SIGNING IDENTITIES"
          echo "========================================"

          security find-identity -v -p codesigning || true

          echo
          echo "========================================"
          echo " EFFECTIVE RELEASE SIGNING SETTINGS"
          echo "========================================"

          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            | grep -E "^[[:space:]]*(CODE_SIGN|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|SUPPORTED_PLATFORMS)" \
            || true

          echo
          echo "========================================"
          echo " REQUESTED APP ENTITLEMENTS"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c Print \
            ios/App/App/App.entitlements \
            || true

          echo
          echo "========================================"
          echo " INSTALLED PROVISIONING PROFILES"
          echo "========================================"

          for profile in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do

            [ -e "$profile" ] || continue

            decoded="/tmp/xcodebuild_logs/$(basename "$profile").plist"

            security cms -D -i "$profile" > "$decoded"

            echo
            echo "----------------------------------------"

            echo "Profile:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' \
              "$decoded" \
              2>/dev/null || echo unknown

            echo "UUID:"
            /usr/libexec/PlistBuddy \
              -c 'Print :UUID' \
              "$decoded" \
              2>/dev/null || echo unknown

            echo "Application identifier:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$decoded" \
              2>/dev/null || echo missing

            echo "Push environment:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:aps-environment' \
              "$decoded" \
              2>/dev/null || echo missing

            echo "Associated domains:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.associated-domains' \
              "$decoded" \
              2>/dev/null || echo missing

            echo "----------------------------------------"

          done

      - name: Build IPA
        script: |
          set -o pipefail

          mkdir -p \
            /tmp/xcodebuild_logs \
            build/ios/xcarchive \
            build/ios/ipa

          rm -rf \
            /tmp/xcodebuild_logs/archive.xcresult \
            /tmp/xcodebuild_logs/export.xcresult \
            build/ios/xcarchive/App.xcarchive

          echo "========================================"
          echo " BUILDING IOS ARCHIVE"
          echo "========================================"

          set +e

          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -resultBundlePath /tmp/xcodebuild_logs/archive.xcresult \
            clean archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild-archive.log

          archive_status=${PIPESTATUS[0]}

          set -e

          if [ "$archive_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " ARCHIVE FAILED"
            echo "========================================"

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate)" \
              /tmp/xcodebuild_logs/xcodebuild-archive.log \
              | head -n 150 \
              || true

            exit "$archive_status"

          fi

          echo
          echo "========================================"
          echo " ARCHIVE SUCCEEDED"
          echo "========================================"

          cat > /tmp/xcodebuild_logs/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

            <key>destination</key>
            <string>export</string>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

            <key>method</key>
            <string>app-store-connect</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>uploadSymbols</key>
            <true/>

          </dict>
          </plist>
          PLIST

          echo
          echo "========================================"
          echo " EXPORTING IPA"
          echo "========================================"

          set +e

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/xcodebuild_logs/ExportOptions.plist \
            -resultBundlePath /tmp/xcodebuild_logs/export.xcresult \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild-export.log

          export_status=${PIPESTATUS[0]}

          set -e

          if [ "$export_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " EXPORT FAILED"
            echo "========================================"

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate)" \
              /tmp/xcodebuild_logs/xcodebuild-export.log \
              | head -n 150 \
              || true

            exit "$export_status"

          fi

          echo
          echo "========================================"
          echo " IPA EXPORT SUCCEEDED"
          echo "========================================"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-play:
    name: ASH Glo Android — Play Store
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      android_signing:
        - ash_glo_keystore

      groups:
        - google_play

      node: 20
      java: 21

    scripts:
      - name: Install JS dependencies
        script: |
          npm install -g npm@11
          npm --version

          rm -rf node_modules

          npm ci --no-audit --no-fund || {
            echo "npm ci failed — falling back to fresh install"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          }

      - name: Capacitor sync
        script: |
          npx cap sync

      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
