workflows:
  ios-app-store:
    name: ASH Glo iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: ash glo

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ashglogroup.mobile

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ashglogroup.mobile"

      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          set -e

          npm install -g npm@11
          npm --version

          rm -rf node_modules

          npm ci --no-audit --no-fund || {
            echo "npm ci failed — falling back to npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund
          }

      - name: Capacitor sync
        script: |
          set -e

          npx cap sync ios

      - name: Set build number
        script: |
          set -e

          cd ios/App

          echo "Current build settings:"
          agvtool what-version -terse

          CURRENT_BUILD=$(
            agvtool what-version -terse 2>/dev/null \
            | head -n 1 \
            | tr -d '[:space:]'
          )

          if ! [[ "$CURRENT_BUILD" =~ ^[0-9]+$ ]]; then
            CURRENT_BUILD=0
          fi

          NEW_BUILD_NUMBER=$((CURRENT_BUILD + 1))

          echo "Current build number: $CURRENT_BUILD"
          echo "New build number: $NEW_BUILD_NUMBER"

          agvtool new-version -all "$NEW_BUILD_NUMBER"

      - name: Initialise keychain and apply signing
        script: |
          set -e

          echo "========================================"
          echo " INITIALISING KEYCHAIN"
          echo "========================================"

          keychain initialize

          echo
          echo "========================================"
          echo " INSTALLING SIGNING CERTIFICATES"
          echo "========================================"

          keychain add-certificates

          echo
          echo "========================================"
          echo " APPLYING PROVISIONING PROFILES"
          echo "========================================"

          xcode-project use-profiles

      - name: Verify iOS signing configuration
        script: |
          set -e

          mkdir -p /tmp/xcodebuild_logs

          echo
          echo "========================================"
          echo " CODE SIGNING IDENTITIES"
          echo "========================================"

          security find-identity -v -p codesigning || true

          echo
          echo "========================================"
          echo " XCODE BUILD SETTINGS"
          echo "========================================"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            | grep -E \
              "^[[:space:]]*(CODE_SIGN|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|SUPPORTED_PLATFORMS)" \
            || true

          echo
          echo "========================================"
          echo " APP ENTITLEMENTS"
          echo "========================================"

          if [ -f "ios/App/App/App.entitlements" ]; then
            /usr/libexec/PlistBuddy \
              -c Print \
              ios/App/App/App.entitlements \
              || true
          else
            echo "No App.entitlements file found"
          fi

          echo
          echo "========================================"
          echo " INSTALLED PROVISIONING PROFILES"
          echo "========================================"

          for profile in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do

            [ -e "$profile" ] || continue

            decoded="/tmp/xcodebuild_logs/$(basename "$profile").plist"

            security cms -D -i "$profile" > "$decoded"

            echo
            echo "----------------------------------------"

            echo "Profile:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' \
              "$decoded" \
              2>/dev/null || echo "unknown"

            echo "UUID:"
            /usr/libexec/PlistBuddy \
              -c 'Print :UUID' \
              "$decoded" \
              2>/dev/null || echo "unknown"

            echo "Application identifier:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "Push environment:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:aps-environment' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "Associated domains:"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.associated-domains' \
              "$decoded" \
              2>/dev/null || echo "missing"

            echo "----------------------------------------"

          done

      - name: Build IPA
        script: |
          set -o pipefail

          mkdir -p \
            /tmp/xcodebuild_logs \
            "$CM_BUILD_DIR/build/ios/xcarchive" \
            "$CM_BUILD_DIR/build/ios/ipa"

          rm -rf \
            /tmp/xcodebuild_logs/archive.xcresult \
            /tmp/xcodebuild_logs/export.xcresult \
            "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"

          echo
          echo "========================================"
          echo " BUILDING IOS ARCHIVE"
          echo "========================================"

          set +e

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -resultBundlePath /tmp/xcodebuild_logs/archive.xcresult \
            clean archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            2>&1 \
            | tee /tmp/xcodebuild_logs/xcodebuild-archive.log

          archive_status=${PIPESTATUS[0]}

          set -e

          if [ "$archive_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " ARCHIVE FAILED"
            echo "========================================"

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate)" \
              /tmp/xcodebuild_logs/xcodebuild-archive.log \
              | head -n 150 \
              || true

            exit "$archive_status"

          fi

          echo
          echo "========================================"
          echo " ARCHIVE SUCCEEDED"
          echo "========================================"

          cat > /tmp/xcodebuild_logs/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

            <key>destination</key>
            <string>export</string>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

            <key>method</key>
            <string>app-store</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>uploadSymbols</key>
            <true/>

          </dict>
          </plist>
          PLIST

          echo
          echo "========================================"
          echo " EXPORTING IPA"
          echo "========================================"

          set +e

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/xcodebuild_logs/ExportOptions.plist \
            -resultBundlePath /tmp/xcodebuild_logs/export.xcresult \
            2>&1 \
            | tee /tmp/xcodebuild_logs/xcodebuild-export.log

          export_status=${PIPESTATUS[0]}

          set -e

          if [ "$export_status" -ne 0 ]; then

            echo
            echo "========================================"
            echo " EXPORT FAILED"
            echo "========================================"

            grep -nE \
              "(error:|fatal error:|CodeSign|Provisioning|requires a provisioning profile|entitlement|certificate)" \
              /tmp/xcodebuild_logs/xcodebuild-export.log \
              | head -n 150 \
              || true

            exit "$export_status"

          fi

          echo
          echo "========================================"
          echo " IPA EXPORT SUCCEEDED"
          echo "========================================"

      - name: Verify generated IPA
        script: |
          set -e

          echo "========================================"
          echo " GENERATED IPA"
          echo "========================================"

          ls -lah "$CM_BUILD_DIR/build/ios/ipa"

          IPA_FILE=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo "IPA:"
          echo "$IPA_FILE"

          echo
          echo "IPA size:"
          du -h "$IPA_FILE"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-play:
    name: ASH Glo Android — Play Store
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      android_signing:
        - ash_glo_keystore

      groups:
        - google_play

      node: 20
      java: 21

    scripts:
      - name: Install JS dependencies
        script: |
          set -e

          npm install -g npm@11
          npm --version

          rm -rf node_modules

          npm ci --no-audit --no-fund || {
            echo "npm ci failed — falling back to npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund
          }

      - name: Capacitor sync
        script: |
          set -e

          npx cap sync android

      - name: Build signed AAB
        script: |
          set -e

          cd android

          chmod +x ./gradlew

          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
